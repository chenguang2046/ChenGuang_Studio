const BRIGHT_COLORS = {
  "Riemann":  0x00ffcc,
  "BSD":      0x7dff9a,
  "Goldbach": 0x00e676
};
const DARK_COLOR  = 0x00a040;   // 暗枝：未解锁切片
const TRUNK_COLOR = 0x00ff88;

const LAYER_NAMES = {
  "Universal": "UNIVERSAL · 通用逻辑基础（暗枝）",
  "Riemann":   "RIEMANN · 黎曼 ζ 切片（发光主题枝）",
  "BSD":       "BSD · 椭圆曲线切片（发光主题枝）",
  "Goldbach":  "GOLDBACH · 哥德巴赫切片（发光主题枝）",
  "Challenge": "CHALLENGE · 挑战定理（暗枝）"
};

/* ============ 树状布局 ============
   树根：暗区切片（Universal + Challenge）交织成底座网络（环 + 连线），y≈0
   树干：发光主柱 y 0→8，标注 H3/H2/H1 中央通道
   三主枝：RIEMANN / BSD / GOLDBACH 从树干上部斜向升空，明亮发光
   暗枝：从树干下部伸出，承载暗色切片
   树冠：顶部 LEAN 核心节点（可点击） */
function makeBranchCurve(direction, baseY, topY, reach) {
  const dir = new THREE.Vector3(Math.cos(direction), 0, Math.sin(direction));
  const pts = [
    new THREE.Vector3(0, baseY, 0),
    new THREE.Vector3(dir.x * reach * 0.35, baseY + (topY - baseY) * 0.45, dir.z * reach * 0.35),
    new THREE.Vector3(dir.x * reach * 0.72, baseY + (topY - baseY) * 0.78, dir.z * reach * 0.72),
    new THREE.Vector3(dir.x * reach, topY, dir.z * reach)
  ];
  return new THREE.CatmullRomCurve3(pts);
}

function layoutSlices() {
  const target = new Map();
  const root = SLICES.filter(s => s.layer === "Universal" || s.layer === "Challenge");
  const riemann = SLICES.filter(s => s.layer === "Riemann");
  const bsd = SLICES.filter(s => s.layer === "BSD");
  const goldbach = SLICES.filter(s => s.layer === "Goldbach");

  // 树根底座：暗区切片环形网络
  const R0 = 8.2;
  root.forEach((s, i) => {
    const a = (i / root.length) * Math.PI * 2 - Math.PI / 2;
    const lift = 0.35 * Math.sin(a * 3 + i * 0.7); // 底座轻微起伏
    target.set(s.id, {
      x: Math.cos(a) * R0, y: 0.25 + lift, z: Math.sin(a) * R0,
      r: 0.36, bright: false, shape: s.layer === "Challenge" ? "oct" : "sph"
    });
  });

  // 三主枝（挂主题切片）
  const branches = [
    { items: riemann, curve: makeBranchCurve(-Math.PI / 2, 4.6, 8.6, 7.6), tag: "RIEMANN" },
    { items: bsd,     curve: makeBranchCurve(Math.PI / 6, 4.8, 8.9, 8.0),  tag: "BSD" },
    { items: goldbach,curve: makeBranchCurve(5 * Math.PI / 6, 4.7, 8.4, 7.4), tag: "GOLDBACH" }
  ];
  for (const b of branches) {
    b.items.forEach((s, i) => {
      const t = b.items.length === 1 ? 0.5 : i / (b.items.length - 1);
      const tEnd = 0.22 + t * 0.72;
      const p = b.curve.getPoint(tEnd);
      target.set(s.id, { x: p.x, y: p.y, z: p.z, r: 0.42, bright: true, shape: "sph", branch: b.tag, t: tEnd });
    });
  }
  return { target, root, branches };
}

let renderer, scene, camera, controls, raycaster;
let coreMesh, coreGlow, ringA, ringB;
let sliceMeshes = [];
let trunkGroup, rootGroup;
let spread = false, collapsing = false;
let animProgress = -1;
let clock = new THREE.Clock();
const LAYOUT = layoutSlices();
const TARGET = LAYOUT.target;
const ROOT_ITEMS = LAYOUT.root;
const CENTER_ORIGIN = new THREE.Vector3(0, 1.2, 0); // 初始聚集点（树根中央）

function init() {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x040a05, 0.008);

  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 300);
  camera.position.set(14, 10, 16);
  camera.lookAt(0, 4.0, 0);

  if (THREE.OrbitControls) {
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 4.0, 0);
    controls.minDistance = 7;
    controls.maxDistance = 60;
    controls.maxPolarAngle = Math.PI * 0.88;
  }

  raycaster = new THREE.Raycaster();
  buildLights();
  buildGround();
  buildTree();
  buildSlices();
  buildRootLinks();
  window.addEventListener("resize", onResize);
  window.addEventListener("pointermove", onPointerMove);
  renderer.domElement.addEventListener("click", onCanvasClick);
  animate();
}

function buildLights() {
  scene.add(new THREE.AmbientLight(0x113322, 0.6));
  const dir = new THREE.DirectionalLight(0x00ff88, 0.7);
  dir.position.set(10, 20, 6);
  scene.add(dir);
  const point = new THREE.PointLight(0x00ffcc, 1.1, 55);
  point.position.set(0, 8, 0);
  scene.add(point);
}

function makeGlow(color, size, spriteTex) {
  const mat = new THREE.SpriteMaterial({ map: spriteTex, color: color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
  const sp = new THREE.Sprite(mat);
  sp.scale.set(size, size, 1);
  return sp;
}

function makeTextSprite(text, color) {
  const c = document.createElement("canvas");
  c.width = 512; c.height = 128;
  const g = c.getContext("2d");
  g.clearRect(0, 0, c.width, c.height);
  g.font = "bold 54px Consolas, monospace";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.shadowColor = color; g.shadowBlur = 18;
  g.fillStyle = color;
  g.fillText(text, c.width / 2, c.height / 2);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  const sp = new THREE.Sprite(mat);
  sp.scale.set(2.6, 0.65, 1);
  return sp;
}

function buildGround() {
  const grid = new THREE.GridHelper(46, 46, 0x00ff66, 0x003a18);
  grid.position.y = -0.03;
  grid.material.transparent = true;
  grid.material.opacity = 0.30;
  scene.add(grid);
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(8.4, 9.1, 96),
    new THREE.MeshBasicMaterial({ color: 0x00ff66, transparent: true, opacity: 0.08, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.0;
  scene.add(ring);
}

/* ---------- 科技之树：树干 / 枝丫 / 树冠 ---------- */
function buildTree() {
  trunkGroup = new THREE.Group();
  scene.add(trunkGroup);
  const tex = makeRadialTexture();

  // 发光树干（H3-H2-H1 中央通道）
  const trunkMat = new THREE.MeshPhongMaterial({
    color: TRUNK_COLOR, emissive: TRUNK_COLOR, emissiveIntensity: 0.75, transparent: true, opacity: 0.9, shininess: 90
  });
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.55, 8.2, 24, 1, true), trunkMat);
  trunk.position.y = 4.1;
  trunkGroup.add(trunk);
  const trunkGlow = makeGlow(0x00ff88, 3.4, tex);
  trunkGlow.position.y = 4.1;
  trunkGroup.add(trunkGlow);

  // 树干能量螺旋
  const helixPts = [];
  for (let i = 0; i <= 160; i++) {
    const t = i / 160;
    const y = 0.15 + t * 8.0;
    const rad = 0.62 + 0.18 * t;
    helixPts.push(new THREE.Vector3(Math.cos(t * Math.PI * 8) * rad, y, Math.sin(t * Math.PI * 8) * rad));
  }
  const helixCurve = new THREE.CatmullRomCurve3(helixPts);
  const helix = new THREE.Mesh(
    new THREE.TubeGeometry(helixCurve, 200, 0.018, 6, false),
    new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.65 })
  );
  trunkGroup.add(helix);

  // H3 / H2 / H1 通道标签
  const h1 = makeTextSprite("H1", "#00ffcc"); h1.position.set(1.7, 1.2, 0.6); trunkGroup.add(h1);
  const h2 = makeTextSprite("H2", "#00ff88"); h2.position.set(-1.7, 4.1, -0.6); trunkGroup.add(h2);
  const h3 = makeTextSprite("H3", "#00ff66"); h3.position.set(1.7, 7.0, 0.6); trunkGroup.add(h3);

  // 三个发光主枝
  const brightBranches = [
    { curve: makeBranchCurve(-Math.PI / 2, 4.6, 8.6, 7.6), color: 0x00ffcc, tag: "RIEMANN" },
    { curve: makeBranchCurve(Math.PI / 6, 4.8, 8.9, 8.0),   color: 0x7dff9a, tag: "BSD" },
    { curve: makeBranchCurve(5 * Math.PI / 6, 4.7, 8.4, 7.4), color: 0x00e676, tag: "GOLDBACH" }
  ];
  for (const b of brightBranches) {
    const tube = new THREE.Mesh(
      new THREE.TubeGeometry(b.curve, 80, 0.09, 8, false),
      new THREE.MeshBasicMaterial({ color: b.color, transparent: true, opacity: 0.9 })
    );
    trunkGroup.add(tube);
    const tip = b.curve.getPoint(1);
    const label = makeTextSprite(b.tag, "#" + b.color.toString(16).padStart(6, "0"));
    label.position.set(tip.x * 1.14, tip.y + 0.5, tip.z * 1.14);
    trunkGroup.add(label);
  }

  // 暗枝（树干下部伸向暗区）
  const darkDirs = [0, Math.PI / 1.6, Math.PI * 2 - Math.PI / 1.6];
  for (const d of darkDirs) {
    const curve = makeBranchCurve(d, 1.6, 2.2, 6.4);
    const tube = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 60, 0.05, 6, false),
      new THREE.MeshBasicMaterial({ color: 0x007a30, transparent: true, opacity: 0.55 })
    );
    trunkGroup.add(tube);
  }

  // 树冠核心（LEAN 节点）
  coreMesh = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.95, 0),
    new THREE.MeshPhongMaterial({ color: 0x00ffcc, emissive: 0x00b355, emissiveIntensity: 1.0, shininess: 90 })
  );
  coreMesh.position.set(0, 9.6, 0);
  scene.add(coreMesh);
  coreGlow = makeGlow(0x00ffcc, 5.6, tex);
  coreGlow.position.copy(coreMesh.position);
  scene.add(coreGlow);
  const leanLabel = makeTextSprite("LEAN", "#00ffcc");
  leanLabel.position.set(0, 10.6, 0);
  scene.add(leanLabel);

  const rmat = new THREE.MeshBasicMaterial({ color: 0x00ff66, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
  ringA = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.02, 8, 80), rmat);
  ringA.position.copy(coreMesh.position);
  scene.add(ringA);
  ringB = new THREE.Mesh(new THREE.TorusGeometry(1.9, 0.012, 8, 80), rmat);
  ringB.position.copy(coreMesh.position);
  scene.add(ringB);
}

function buildSlices() {
  const tex = makeRadialTexture();
  for (const s of SLICES) {
    const t = TARGET.get(s.id);
    const color = t.bright ? BRIGHT_COLORS[s.layer] : DARK_COLOR;
    const geo = t.shape === "oct"
      ? new THREE.OctahedronGeometry(t.r * 1.25, 0)
      : new THREE.SphereGeometry(t.r, 20, 20);
    const mat = new THREE.MeshPhongMaterial({
      color: color,
      emissive: color,
      emissiveIntensity: t.bright ? 0.85 : 0.28,   // 明暗对比
      transparent: true,
      opacity: t.bright ? 1.0 : 0.62,
      shininess: t.bright ? 70 : 20
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(CENTER_ORIGIN);
    mesh.userData = s;
    mesh.visible = false;
    scene.add(mesh);
    const glowSize = t.bright ? t.r * 7.5 : t.r * 3.2;
    const glow = makeGlow(color, glowSize, tex);
    glow.position.copy(mesh.position);
    glow.visible = false;
    scene.add(glow);
    sliceMeshes.push({ mesh, glow, data: s, home: t, orig: mesh.position.clone() });
  }
}

/* 树根网络连线（暗区切片交织） */
function buildRootLinks() {
  rootGroup = new THREE.Group();
  scene.add(rootGroup);
  rootGroup.visible = false;
  const pts = ROOT_ITEMS.map(s => {
    const t = TARGET.get(s.id);
    return new THREE.Vector3(t.x, t.y, t.z);
  });
  // 环相邻连线 + 稀疏交叉连线（交织网络）
  const lines = [];
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    const a = pts[i];
    const b = pts[(i + 1) % n];
    lines.push(a.x, a.y, a.z, b.x, b.y, b.z);
    if (i % 7 === 0) {
      const c = pts[(i + Math.floor(n / 2)) % n];
      lines.push(a.x, a.y, a.z, c.x, c.y, c.z);
    }
    if (i % 11 === 0) {
      const d = pts[(i + 23) % n];
      lines.push(a.x, a.y, a.z, d.x, d.y, d.z);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(lines, 3));
  const lineMat = new THREE.LineBasicMaterial({ color: 0x00a040, transparent: true, opacity: 0.32 });
  const segs = new THREE.LineSegments(geo, lineMat);
  rootGroup.add(segs);
}

function makeRadialTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(64, 64, 2, 64, 64, 64);
  grad.addColorStop(0, "rgba(255,255,255,0.85)");
  grad.addColorStop(0.35, "rgba(255,255,255,0.30)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

/* ---------- 点击动画：生长散开 / 收回 ---------- */
const EASE = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function toggleSpread() {
  if (animProgress < 0) {
    animProgress = 0;
    sliceMeshes.forEach(o => { o.mesh.visible = true; o.glow.visible = true; });
    if (rootGroup) rootGroup.visible = true;
  } else if (animProgress === 2) {
    animProgress = 0;
    collapsing = true;
  } else return;
  const pulse = document.getElementById("clickPulse");
  pulse.style.animation = "none";
  void pulse.offsetWidth;
  pulse.style.animation = "";
  pulse.classList.remove("pulse");
  void pulse.offsetWidth;
  pulse.classList.add("pulse");
}

function updateAnimation() {
  if (animProgress < 0 || animProgress === 2) return;
  const dt = clock.getDelta();
  animProgress = Math.min(animProgress + dt * 0.5, 1);
  const p = EASE(animProgress);
  for (const o of sliceMeshes) {
    const t = o.home;
    const from = o.orig.clone();
    const to = collapsing ? CENTER_ORIGIN.clone() : new THREE.Vector3(t.x, t.y, t.z);
    o.mesh.position.lerpVectors(from, to, p);
    o.glow.position.copy(o.mesh.position);
  }
  if (animProgress >= 1) {
    if (collapsing) {
      collapsing = false; spread = false; animProgress = -1;
      sliceMeshes.forEach(o => { o.mesh.visible = false; o.glow.visible = false; });
      if (rootGroup) rootGroup.visible = false;
      sliceMeshes.forEach(o => { o.orig.copy(o.mesh.position); });
    } else {
      animProgress = 2; spread = true;
    }
  }
}

/* ---------- 悬停 / 点击 ---------- */
const tooltip = document.getElementById("tooltip");
let hovered = null;

function pickObjects(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((clientX - rect.left) / rect.width) * 2 - 1,
    -((clientY - rect.top) / rect.height) * 2 + 1
  );
  raycaster.setFromCamera(ndc, camera);
  const meshes = sliceMeshes.map(o => o.mesh);
  const hits = raycaster.intersectObjects(meshes, false);
  if (hits.length > 0) return hits[0].object;
  const core = raycaster.intersectObject(coreMesh, false);
  if (core.length > 0) return core[0].object;
  return null;
}

function onPointerMove(e) {
  const obj = pickObjects(e.clientX, e.clientY);
  if (obj && obj.userData) {
    if (hovered && hovered !== obj) hovered.scale.setScalar(1);
    hovered = obj;
    hovered.scale.setScalar(1.3);
    showTooltip(e.clientX, e.clientY, obj.userData);
  } else {
    if (hovered) hovered.scale.setScalar(1);
    hovered = null;
    tooltip.style.display = "none";
  }
}

function showTooltip(x, y, s) {
  tooltip.innerHTML =
    '<div class="tt-id">SLICE ' + (s.layer === "Challenge" ? "C#" + s.no : "S#" + String(s.no).padStart(3, "0")) +
    ' · ' + s.layer + '</div>' +
    '<div class="tt-theme">' + s.theme + '</div>' +
    '<div class="tt-thm">' + s.theorem + '</div>' +
    '<div><span class="tt-exit">' + s.exit + '</span> <span class="tt-layer">' + LAYER_NAMES[s.layer] + '</span></div>' +
    '<div class="tt-deps">deps: ' + s.deps + '</div>';
  tooltip.style.display = "block";
  const pad = 18;
  const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
  let px = x + pad, py = y + pad;
  if (px + tw > window.innerWidth - 10) px = x - tw - pad;
  if (py + th > window.innerHeight - 10) py = y - th - pad;
  tooltip.style.left = px + "px";
  tooltip.style.top = py + "px";
}

function onCanvasClick(e) {
  const obj = pickObjects(e.clientX, e.clientY);
  if (obj === coreMesh) { toggleSpread(); return; }
  if (obj && obj.userData) {
    showTooltip(e.clientX, e.clientY, obj.userData);
    return;
  }
}

/* ---------- 主循环 ---------- */
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  // 树冠脉动 + 光环
  const pulse = 1 + Math.sin(t * 2.2) * 0.06;
  coreMesh.scale.setScalar(pulse);
  ringA.rotation.x = Math.PI / 2 + Math.sin(t * 0.6) * 0.1;
  ringA.rotation.y += 0.01;
  ringB.rotation.x = Math.PI / 2 - Math.sin(t * 0.6) * 0.1;
  ringB.rotation.y -= 0.006;

  // 切片微浮：亮区明显、暗区微弱
  if (spread) {
    for (const o of sliceMeshes) {
      const amp = o.home.bright ? 0.10 : 0.05;
      const yy = o.home.y + Math.sin(t * 0.9 + o.data.id * 0.37) * amp;
      o.mesh.position.y = yy;
      o.glow.position.copy(o.mesh.position);
    }
    if (rootGroup) rootGroup.rotation.y = t * 0.02;
  }
  updateAnimation();
  if (controls) controls.update();
  else {
    camera.position.x = Math.cos(t * 0.05) * camera.position.length();
    camera.position.z = Math.sin(t * 0.05) * camera.position.length();
    camera.lookAt(0, 4.0, 0);
  }
  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

/* 数据完整性自检 */
const BY_LAYER = {};
SLICES.forEach(s => { BY_LAYER[s.layer] = (BY_LAYER[s.layer] || 0) + 1; });
console.log("[LEAN TREE] slices:", SLICES.length, BY_LAYER);

if (!THREE.OrbitControls) console.warn("[LEAN TREE] OrbitControls 加载失败，启用自动旋转模式");

init();
</script>
